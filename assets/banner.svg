<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Ally Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0612"/>
      <stop offset="0.55" stop-color="#160b2e"/>
      <stop offset="1" stop-color="#07122a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>

  <!-- handheld silhouette with glowing rings -->
  <g transform="translate(820 110)">
    <rect x="0" y="0" width="360" height="180" rx="90" fill="#0b0d14" stroke="#2e3448" stroke-width="3"/>
    <rect x="96" y="22" width="168" height="136" rx="14" fill="#141826" stroke="#2e3448" stroke-width="2"/>
    <rect x="108" y="34" width="144" height="10" rx="5" fill="url(#accent)" opacity="0.9"/>
    <rect x="108" y="54" width="96" height="8" rx="4" fill="#3a4160"/>
    <rect x="108" y="70" width="120" height="8" rx="4" fill="#3a4160"/>
    <rect x="108" y="92" width="66" height="50" rx="8" fill="#1e2438"/>
    <rect x="182" y="92" width="66" height="50" rx="8" fill="#1e2438"/>
    <circle cx="52" cy="70" r="26" fill="none" stroke="url(#ring)" stroke-width="7"/>
    <circle cx="52" cy="70" r="11" fill="#e7e9f0"/>
    <circle cx="308" cy="118" r="26" fill="none" stroke="url(#ring)" stroke-width="7"/>
    <circle cx="308" cy="118" r="11" fill="#e7e9f0"/>
    <circle cx="300" cy="50" r="7" fill="#22c55e"/>
    <circle cx="318" cy="64" r="7" fill="#e11d48"/>
    <circle cx="282" cy="64" r="7" fill="#3b82f6"/>
    <circle cx="300" cy="78" r="7" fill="#f59e0b"/>
    <path d="M42 130h20M52 120v20" stroke="#5d6478" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="80" y="170" font-family="Inter, Segoe UI, Noto Sans, sans-serif" font-size="92" font-weight="800" fill="#ffffff">Ally Hub</text>
  <rect x="84" y="196" width="150" height="8" rx="4" fill="url(#accent)"/>
  <text x="80" y="256" font-family="Inter, Segoe UI, Noto Sans, sans-serif" font-size="30" fill="#c9c3e0">Mods, performance, lighting and themes</text>
  <text x="80" y="296" font-family="Inter, Segoe UI, Noto Sans, sans-serif" font-size="30" fill="#c9c3e0">for the ROG Xbox Ally X on SteamOS</text>
</svg>
